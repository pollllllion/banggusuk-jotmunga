<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>오프라인 · 방구석좋문가</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
        background: #F7F7F8; color: #27272A; line-height: 1.6;
        min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      }
      .box { text-align: center; max-width: 320px; }
      img { width: 96px; height: 96px; border-radius: 20px; margin-bottom: 18px; }
      h1 { font-size: 18px; font-weight: 800; color: #18181B; margin-bottom: 8px; }
      p { font-size: 14px; color: #52525B; }
      button {
        margin-top: 20px; padding: 10px 22px; border: none; border-radius: 8px;
        background: #52525B; color: #fff; font-size: 14px; font-weight: 700;
        font-family: inherit; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/icons/icon-192.png" alt="" />
      <h1>인터넷이 끊겼어요</h1>
      <p>연결이 돌아오면 캘린더와 토론방을 다시 볼 수 있어요.</p>
      <button onclick="location.reload()">다시 시도</button>
    </div>
  </body>
</html>
