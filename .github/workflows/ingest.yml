name: TMDB 콘텐츠 자동 수집 (ingest)

# 매일 새벽 3시(KST) 자동 실행 + 언제든 수동 실행 가능
on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC = 03:00 KST 매일
  workflow_dispatch: # Actions 탭에서 "Run workflow" 버튼으로 수동 실행

# 동시에 두 번 돌지 않도록
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 콘텐츠 수집 실행
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 필요시 더 많이 긁으려면 PAGES 조정 (기본 3)
          PAGES: '3'
        run: node scripts/ingest-tmdb.mjs

      # 위 수집은 목록 API 만 읽어서 채널·출연진·OTT 가 빈 행을 만든다. 이용자가 검색으로
      # 등록한 작품(ensure_content)도 마찬가지다. 상세는 여기서 채운다 — 이 단계가 없던 동안
      # 'SBS 드라마인데 채널이 안 뜨는' 작품이 쌓였다('각성', 2026-09-18).
      # 평소엔 새 행·최근 공개작만, 일요일엔 옛 행까지 전부 다시 본다(scripts/tmdb-lib.mjs needsEnrich).
      - name: 상세정보 보강 (채널·출연진·OTT)
        if: always()
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "$(date -u +%u)" = "7" ]; then ALL="--all"; else ALL=""; fi
          node scripts/enrich-tmdb.mjs --apply $ALL

      # 방영 중인 시리즈의 다음 회차(날짜·번호). 매주 바뀌는 값이라 빈 칸만 채우는 보강과 따로 돈다.
      # 칸이 아직 없으면(migration_next_episode.sql 적용 전) 안내만 찍고 넘어간다.
      - name: 다음 회차 동기화
        if: always()
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "$(date -u +%u)" = "7" ]; then ALL="--all"; else ALL=""; fi
          node scripts/sync-next-episodes.mjs --apply $ALL

      # 공개 상태(공개 예정 / 공개 중 / 완결) 재판정. 수집기는 새 행에 'upcoming' 만 적고
      # 공개일이 지나도 고치지 않는다 — 이 단계가 매일 그걸 따라잡는다. 다음 회차 동기화 뒤에
      # 둔 건 방영 중 판정이 nextEpisodeDate 를 먼저 보기 때문이다(그만큼 TMDB 호출이 준다).
      # 평소엔 바뀔 수 있는 행만, 일요일엔 완결 행까지 전부 다시 본다.
      - name: 공개 상태 재판정
        if: always()
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "$(date -u +%u)" = "7" ]; then ALL="--all"; else ALL=""; fi
          node scripts/sync-status.mjs --apply $ALL

      # 누적관객수(영화진흥위원회) — 한국 극장 개봉 영화만. 상영 중에는 매일 오르는 값이라
      # 빈 칸만 채우는 보강과 따로 돈다. KOFIC 키가 없거나 칸이 아직 없으면 안내만 찍고 넘어간다.
      - name: 누적관객수 동기화 (KOFIC)
        if: always()
        env:
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/sync-kofic.mjs --apply --days=10

      # 공개 예정작은 수집 때 포스터가 없다가 나중에 올라오는 일이 많다 — 빈 칸만 다시 본다.
      # 포스터가 없으면 모바일 캘린더 칸이 회색 박스로 남는다. 03:30 재배포(daily-rebuild)가 반영한다.
      - name: 빈 포스터 채우기
        if: always()
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/fill-posters.mjs --apply

      # 중복은 수집이 만든다 — 정리도 수집 옆에 붙여 둔다.
      # 근거가 분명한 것만 자동으로 합치고, 동명이작 후보는 이 실행의 요약에
      # 경고로 남는다(예: '기프트' — 야구 코치물 vs 휠체어 럭비물).
      # 수집이 실패해도 기존 중복은 정리해 둔다.
      - name: 중복 작품 병합
        if: always()
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/merge-dups.mjs --apply

      # 구글 유입 검색어 — 우리 사이트에서는 알 수 없는 값이라 Search Console 에서 받아 온다.
      # 며칠치를 겹쳐 받는다(구글 수치는 2~3일 뒤에도 늘어난다). 키가 없으면 건너뛴다.
      - name: 구글 유입 검색어 수집
        if: always()
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/fetch-gsc.mjs --days=10

      # 병합은 되돌리기 어렵다 — 직전 상태를 90일 남긴다
      - name: 병합 백업 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-backup
          path: scripts/merge-backup-*.json
          retention-days: 90
          if-no-files-found: ignore
