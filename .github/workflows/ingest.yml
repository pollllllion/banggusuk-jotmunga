name: TMDB 콘텐츠 자동 수집 (ingest)

# 매일 새벽 3시(KST) 자동 실행 + 언제든 수동 실행 가능
on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC = 03:00 KST 매일
  workflow_dispatch: # Actions 탭에서 "Run workflow" 버튼으로 수동 실행

# 동시에 두 번 돌지 않도록
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 콘텐츠 수집 실행
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 필요시 더 많이 긁으려면 PAGES 조정 (기본 3)
          PAGES: '3'
        run: node scripts/ingest-tmdb.mjs

      # 중복은 수집이 만든다 — 정리도 수집 옆에 붙여 둔다.
      # 근거가 분명한 것만 자동으로 합치고, 동명이작 후보는 이 실행의 요약에
      # 경고로 남는다(예: '기프트' — 야구 코치물 vs 휠체어 럭비물).
      # 수집이 실패해도 기존 중복은 정리해 둔다.
      - name: 중복 작품 병합
        if: always()
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/merge-dups.mjs --apply

      # 구글 유입 검색어 — 우리 사이트에서는 알 수 없는 값이라 Search Console 에서 받아 온다.
      # 며칠치를 겹쳐 받는다(구글 수치는 2~3일 뒤에도 늘어난다). 키가 없으면 건너뛴다.
      - name: 구글 유입 검색어 수집
        if: always()
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/fetch-gsc.mjs --days=10

      # 병합은 되돌리기 어렵다 — 직전 상태를 90일 남긴다
      - name: 병합 백업 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-backup
          path: scripts/merge-backup-*.json
          retention-days: 90
          if-no-files-found: ignore
