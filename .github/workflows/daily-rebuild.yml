name: 정기 재배포 (새 글·작품을 검색엔진용 페이지에 반영)

# 토론글·작품 페이지의 정적 HTML(프리렌더)과 sitemap.xml 은 **빌드할 때만** 만들어진다.
# 그래서 글이 올라와도 누가 main 에 push 하기 전까지는 검색엔진이 그 주소에서
# 사이트 기본 제목만 든 빈 SPA 껍데기를 받고, 사이트맵에도 안 실린다(2026-09-18 실측).
#
# 배포는 Cloudflare Workers Builds 가 main push 를 받아서 한다(CLAUDE.md '배포').
# 대시보드·API 토큰 없이 빌드를 일으키는 방법이 push 뿐이라 빈 커밋을 하나 올린다.
#
#   03:30 KST — ingest(03:00, 새 작품 수집) 뒤
#   21:00 KST — 낮에 올라온 토론글
#
# 빌드 한도 월 500회 중 60회. 사람이 방금 push 했으면(3시간 안) 건너뛴다.
# 로컬에서 push 가 거절되면 `git pull --rebase` 후 다시 push 하면 된다.
on:
  schedule:
    - cron: '30 18 * * *'  # 18:30 UTC = 03:30 KST
    - cron: '0 12 * * *'   # 12:00 UTC = 21:00 KST
  workflow_dispatch:

concurrency:
  group: daily-rebuild
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # 빈 커밋 push 는 몇 초면 끝나지만, IndexNow 단계가 새 빌드가 라이브에 뜰 때까지(최대 15분) 기다린다
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 빈 커밋을 main 에 push (= Cloudflare 빌드)
        id: push
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( $(date +%s) - last ))
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$age" -lt 10800 ]; then
            echo "마지막 커밋이 $((age / 60))분 전 — 이미 새로 빌드됐으니 건너뜁니다."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m "chore: 정기 재배포 — 새 글·작품을 프리렌더·사이트맵에 반영 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # 이번 빌드로 새로 생긴 페이지를 네이버·빙에 바로 알린다 (scripts/indexnow.mjs).
      # 배포 전 sitemap 을 받아 두고, 새 빌드가 라이브에 뜨면 다시 받아 늘어난 주소만 보낸다.
      # 실패해도 배포와는 무관하다 — 다음 재배포 때 다시 비교된다.
      - name: 새 페이지를 검색엔진에 알림 (IndexNow)
        if: steps.push.outputs.pushed == 'true'
        continue-on-error: true
        run: node scripts/indexnow.mjs --wait-deploy
