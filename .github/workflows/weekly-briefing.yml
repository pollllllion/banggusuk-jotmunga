name: 주간 OTT 업계 브리핑 (텔레그램)

# 매주 월 08:00 KST — OpenAI(Responses API + web_search)가 지난 7일 OTT·데이터소스 변화를 조사해
# OTTCAL 관점 3~5건으로 정리하고 텔레그램으로 보낸다(scripts/weekly-briefing.mjs).
# 외부 패키지를 쓰지 않아 npm ci 가 필요 없다.
#
# Secrets: OPENAI_API_KEY · BRIEFING_TELEGRAM_BOT_TOKEN · BRIEFING_TELEGRAM_CHAT_ID (브리핑 전용 봇·방)
# Variables(선택): OPENAI_MODEL · OPENAI_REASONING_EFFORT — 없으면 스크립트 기본값
on:
  schedule:
    - cron: '0 23 * * 0'   # 일 23:00 UTC = 월 08:00 KST
  workflow_dispatch:
    inputs:
      mode:
        description: 'full=조사→텔레그램 전송 / telegram-test=텔레그램 테스트 한 통만'
        type: choice
        options: [full, telegram-test]
        default: full

concurrency:
  group: weekly-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 브리핑 생성·발송
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRIEFING_TELEGRAM_BOT_TOKEN: ${{ secrets.BRIEFING_TELEGRAM_BOT_TOKEN }}
          BRIEFING_TELEGRAM_CHAT_ID: ${{ secrets.BRIEFING_TELEGRAM_CHAT_ID }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}
        run: node scripts/weekly-briefing.mjs ${{ inputs.mode == 'telegram-test' && '--test' || '' }}
