[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # 프론트 공개용 TMDB v3 클라이언트 키(내 피드/어드민 작품 검색). VITE_는 번들에 노출되는 공개키라 여기 둠.
  VITE_TMDB_API_KEY = "b3895231dd8a099e53e6ac823fae48b1"

# SPA 라우팅: 모든 경로를 index.html로 (새로고침/직접접속 404 방지)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
