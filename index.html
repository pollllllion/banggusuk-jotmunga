<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 아이폰 홈바 영역까지 그리고, 하단 탭은 CSS env(safe-area-inset-bottom)으로 띄운다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      JS 실행 전(크롤러 1차 수집·카톡 공유 미리보기)에 읽히는 기본값.
      라우팅 후에는 src/components/seo/Seo.tsx 가 같은 태그를 페이지별 값으로 교체한다.
      아래 seo:start~seo:end 구간은 빌드 후 scripts/prerender.mjs 가 페이지별 값으로 통째로 갈아끼운다.
    -->
    <!--seo:start-->
    <title>오티티칼 - OTT 공개일·개봉일 캘린더</title>
    <meta name="description" content="넷플릭스·디즈니+·티빙·웨이브 등 OTT 공개일과 영화 개봉일을 달력 하나로. 공개 예정 작품의 D-day와 편성 정보, 기대평과 솔직 리뷰까지 한눈에 확인하세요." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ottcal.com/" />

    <meta property="og:site_name" content="오티티칼" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="오티티칼 - OTT 공개일·개봉일 캘린더" />
    <meta property="og:description" content="넷플릭스·디즈니+·티빙·웨이브 등 OTT 공개일과 영화 개봉일을 달력 하나로. 공개 예정 작품의 D-day와 편성 정보, 기대평과 솔직 리뷰까지 한눈에 확인하세요." />
    <meta property="og:image" content="https://ottcal.com/logo.png" />
    <meta property="og:url" content="https://ottcal.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="오티티칼 - OTT 공개일·개봉일 캘린더" />
    <meta name="twitter:description" content="넷플릭스·디즈니+·티빙·웨이브 등 OTT 공개일과 영화 개봉일을 달력 하나로. 공개 예정 작품의 D-day와 편성 정보, 기대평과 솔직 리뷰까지 한눈에 확인하세요." />
    <meta name="twitter:image" content="https://ottcal.com/logo.png" />
    <!--seo:end-->

    <!--
      검색엔진 소유확인 (네이버 서치어드바이저 · 구글 서치콘솔).
      seo:start~end 구간 밖에 둬야 프리렌더된 하위 페이지에서도 살아남는다.
      Seo.tsx 도 이 태그는 건드리지 않으므로 라우팅 후에도 유지된다.
      ⚠️ 확인이 끝난 뒤에도 지우면 안 된다 — 구글·네이버가 주기적으로 다시 확인한다.
    -->
    <!--
      네이버 태그가 둘인 이유: 아래 aaded818… 은 예전에 등록해 둔 것이고,
      c285efc9… 는 2026-09-09 새로 등록하며 받은 것이다. 옛 등록이 아직 살아 있을 수
      있어(다른 계정일 가능성) 지우지 않고 새 것을 위에 둔다.
      새 소유확인이 통과된 뒤에도 옛 줄이 필요 없다고 확인되면 그때 지우면 된다.
    -->
    <meta name="naver-site-verification" content="c285efc9d51ca5173be66fb31b6037ee91e434f9" />
    <meta name="naver-site-verification" content="aaded818520860e85feaac59cbf9aa942205f689" />
    <meta name="google-site-verification" content="Grtwy20sDv1k2FrciiGf2KqMuRr5BGNu0eRdpFtGzpw" />

    <!-- 사파리는 SVG 파비콘을 제대로 못 읽어서 옛 아이콘을 그대로 보여줬다. PNG 를 함께 준다.
         파일 이름이 새것이라 캐시에 막히지 않는다 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      PWA (홈화면 설치 · 오프라인 · 푸시).
      seo:start~end 구간 밖에 둬야 프리렌더된 하위 페이지에서도 살아남는다.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iOS 는 manifest 를 안 읽는다 — 홈화면 추가 시 필요한 값을 따로 준다 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="오티티칼" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!--
      테마를 번들보다 먼저 적용한다.
      React 가 뜬 뒤에 하면 다크 사용자에게 흰 화면이 한 번 번쩍인다(FOUC).
      저장 키는 src/utils/theme.ts 의 THEME_KEY 와 같아야 한다.
      try/catch 인 이유: 사생활 보호 모드에서는 localStorage 접근 자체가 throw 한다.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('bangjot_theme')
          if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia
            && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) {
            var m = document.querySelector('meta[name="theme-color"]')
            if (m) m.setAttribute('content', '#131316')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <!--prerender:start--><!--prerender:end-->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
